myhostname = @HOST@
myorigin = $myhostname
mydestination =
relay_domains =
relayhost =
local_transport = error:local delivery disabled
authorized_submit_users = root
inet_interfaces = @LISTEN@
inet_protocols = ipv4
mynetworks = 127.0.0.0/8
smtpd_banner = $myhostname ESMTP
smtpd_helo_required = yes
disable_vrfy_command = yes
smtpd_sasl_auth_enable = no
smtpd_sasl_type = dovecot
smtpd_sasl_path = private/alma-auth
smtpd_sasl_security_options = noanonymous
smtpd_relay_restrictions = reject_unauth_destination
smtpd_recipient_restrictions = reject_unauth_destination
smtpd_sender_login_maps = proxy:texthash:/etc/postfix/almapanel/senders
smtpd_tls_security_level = may
smtpd_tls_cert_file = /etc/almapanel/mail/fullchain.pem
smtpd_tls_key_file = /etc/almapanel/mail/private.pem
smtpd_tls_auth_only = yes
smtpd_tls_protocols = >=TLSv1.2
smtpd_tls_mandatory_protocols = >=TLSv1.2
smtp_tls_security_level = may
virtual_mailbox_domains = proxy:texthash:/etc/postfix/almapanel/domains
virtual_mailbox_maps = proxy:texthash:/etc/postfix/almapanel/recipients
virtual_alias_maps = proxy:texthash:/etc/postfix/almapanel/aliases
virtual_transport = lmtp:unix:private/alma-lmtp
recipient_delimiter =
message_size_limit = 20971520
smtpd_client_connection_count_limit = 10
smtpd_client_message_rate_limit = 30
smtpd_client_recipient_rate_limit = 80
smtpd_client_event_limit_exceptions =
