protocols = imap lmtp
listen = @LISTEN@
base_dir = /run/dovecot
state_dir = /var/lib/dovecot
mail_location = maildir:~/Maildir
first_valid_uid = @UID@
last_valid_uid = @UID@
first_valid_gid = @GID@
last_valid_gid = @GID@
default_internal_user = dovecot
auth_username_format = %Lu
auth_mechanisms = plain login
disable_plaintext_auth = yes
auth_failure_delay = 2 secs
ssl = required
ssl_min_protocol = TLSv1.2
ssl_cert = </etc/almapanel/mail/fullchain.pem
ssl_key = </etc/almapanel/mail/private.pem

passdb {
  driver = passwd-file
  args = scheme=SHA512-CRYPT username_format=%u /etc/dovecot/almapanel/passwd
}
userdb {
  driver = passwd-file
  args = username_format=%u /etc/dovecot/almapanel/passwd
}
namespace inbox {
  inbox = yes
}
mail_plugins = quota
protocol imap {
  mail_plugins = quota imap_quota
}
protocol lmtp {
  postmaster_address = postmaster@%d
  lmtp_rcpt_check_quota = yes
}
plugin {
  quota = maildir:Mailbox quota
}
service imap-login {
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}
service lmtp {
  unix_listener /var/spool/postfix/private/alma-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}
service auth {
  unix_listener /var/spool/postfix/private/alma-auth {
    mode = 0600
    user = postfix
    group = postfix
  }
}
