limit_req_zone $binary_remote_addr zone=alma_auth:1m rate=5r/m;
server {
 listen @BIND@:8443 ssl;
 server_name @HOST@ localhost;
 ssl_certificate /etc/almapanel/panel.crt;
 ssl_certificate_key /etc/almapanel/panel.key;
 ssl_protocols TLSv1.2 TLSv1.3;
 server_tokens off;
 client_max_body_size 1500k;
 proxy_read_timeout 160s;
 add_header X-Frame-Options DENY always;
 add_header X-Content-Type-Options nosniff always;
 location ~ ^/api/(login|setup)$ {
  limit_req zone=alma_auth burst=5 nodelay;
  proxy_pass http://unix:/run/almapanel-api/http.sock;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
 }
 location / {
  proxy_pass http://unix:/run/almapanel-api/http.sock;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
 }
}
