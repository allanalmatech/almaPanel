# TEMPLATE ONLY: deploy after DNS, TLS, owner approval and release gates.
server {
 listen 443 ssl;
 server_name install.almatechconsults.com;
 ssl_certificate /etc/letsencrypt/live/install.almatechconsults.com/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/install.almatechconsults.com/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 root /var/www/almapanel-installer;
 autoindex off;
 add_header X-Content-Type-Options nosniff always;
 location = /almapanel.sh { default_type text/plain; try_files $uri =404; }
 location /releases/ { try_files $uri =404; }
 location / { return 404; }
}
