AWSTemplateFormatVersion: '2010-09-09'
Description: almaPanel Ubuntu evaluation VM - review AWS costs before deployment
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet with Internet gateway route
  AmiId:
    Type: AWS::EC2::Image::Id
    Description: Verified Canonical Ubuntu Server 24.04 amd64 AMI in this region
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
  AdminCidr:
    Type: String
    Description: Your administrator public IPv4 with /32 prefix
    AllowedPattern: '^(?:[0-9]{1,3}\.){3}[0-9]{1,3}/32$'
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small]
Resources:
  PanelSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SSH from admin; hosted HTTP; panel via SSH tunnel only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AdminCidr
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Project
          Value: almaPanel
  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      CreditSpecification:
        CPUCredits: standard
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: true
          SubnetId: !Ref SubnetId
          GroupSet: [!Ref PanelSecurityGroup]
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 12
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: almaPanel-evaluation
Outputs:
  PublicIp:
    Value: !GetAtt Instance.PublicIp
  Connect:
    Value: !Sub 'ssh -L 8443:127.0.0.1:8443 ubuntu@${Instance.PublicIp}'
