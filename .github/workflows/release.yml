name: Gated release validation
on: workflow_dispatch
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/release_gate.py
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/package.py
# Publication deliberately absent until owner approval, live acceptance evidence,
# signing key provisioning and protected-environment release review are complete.
